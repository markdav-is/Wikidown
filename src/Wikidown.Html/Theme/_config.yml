# Site settings for `wikidown export-html`, which renders this wiki to a
# static site. Installed by `wikidown pages`. Safe to edit — never
# overwritten unless you pass --force.
#
# Published by .github/workflows/pages.yml. In GitHub:
# Settings → Pages → Source: "GitHub Actions".
# Preview locally: wikidown export-html --output _site --clean

title: "{{TITLE}}"
description: ""
# Uncomment to add a GitHub link to the top bar:
# repository_url: https://github.com/<owner>/<repo>
# Uncomment to set a favicon (path relative to the wiki root):
# favicon: /favicon.ico
# Uncomment for link previews (Slack, Teams, social): the site's public
# address and an image path relative to the wiki root.
# url: https://<owner>.github.io
# image: /images/logo.png

# wikidown:
#   # Subtrees to leave out of the published site (nav and pages). The
#   # pages stay first-class for the CLI and editor.
#   exclude_from_site:
#     - /Internal-Notes
#   # Serve a page as the site's index.html, and give pages their own
#   # layouts (_layouts/<name>.html). See the Site Templates docs.
#   root_page: /Home
#   layouts:
#     /Home: landing
