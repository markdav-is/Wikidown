name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Most users run Wikidown on Windows: line endings, path casing, reserved
  # file names and console encoding only misbehave there.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Wikidown.slnf --configuration Release
      - name: Test
        run: dotnet test Wikidown.slnf --configuration Release --no-build
      - name: Walk /docs with the CLI (dogfood)
        run: |
          dotnet run --project src/Wikidown.Cli --no-build --configuration Release -- list
          dotnet run --project src/Wikidown.Cli --no-build --configuration Release -- export-html --output publish/docs-site --clean
          if (-not (Test-Path publish/docs-site/Getting-Started/Format.html)) { exit 1 }

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Wikidown.slnf
      - name: Build
        run: dotnet build Wikidown.slnf --configuration Release --no-restore
      - name: Test
        run: dotnet test Wikidown.slnf --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Pack
        run: |
          dotnet pack src/Wikidown.Cli/Wikidown.Cli.csproj --configuration Release --no-build -o artifacts
      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikidown-nupkgs
          path: artifacts/*.nupkg
          if-no-files-found: warn
      - name: Publish editor (smoke)
        run: dotnet publish src/Wikidown.Web/Wikidown.Web.csproj -c Release -o publish/web
      - name: Walk /docs with the CLI (dogfood)
        run: |
          dotnet run --project src/Wikidown.Cli --no-build --configuration Release -- list
          dotnet run --project src/Wikidown.Cli --no-build --configuration Release -- search --query wikidown
          dotnet run --project src/Wikidown.Cli --no-build --configuration Release -- export-html --output publish/docs-site --clean
          test -f publish/docs-site/Getting-Started/Format.html
