name: vsix

on:
  push:
    branches: [main]
    paths:
      - 'src/Wikidown.Vs/**'
      - 'Directory.Build.props'
      - '.github/workflows/vsix.yml'
    tags:
      - 'vsix-v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach .vsix to GitHub Releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild src/Wikidown.Vs/Wikidown.Vs.csproj /t:Restore /p:Configuration=Release

      - name: Build VSIX
        run: |
          msbuild src/Wikidown.Vs/Wikidown.Vs.csproj `
            /p:Configuration=Release `
            /p:DeployExtension=false `
            /p:OutDir=artifacts/vsix/

      - name: Verify VSIX was produced
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path "src/Wikidown.Vs/artifacts/vsix/*.vsix" -ErrorAction SilentlyContinue
          if (-not $vsix) { Write-Error "Build succeeded but produced no .vsix — VSSDK targets did not run."; exit 1 }
          Write-Host "Built $($vsix.FullName) ($([math]::Round($vsix.Length / 1kb)) KB)"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikidown-vsix
          path: src/Wikidown.Vs/artifacts/vsix/*.vsix
          if-no-files-found: error

      # ── Marketplace publish (vsix-v* tag pushes only, requires VSIX_PAT secret) ──
      - name: Publish to Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/vsix-v')
        env:
          VSIX_PAT: ${{ secrets.VSIX_PAT }}
        shell: pwsh
        run: |
          if (-not $env:VSIX_PAT) { Write-Error "VSIX_PAT secret is not set"; exit 1 }
          $vsix = Get-ChildItem -Path "src/Wikidown.Vs/artifacts/vsix/*.vsix" | Select-Object -First 1

          # VsixPublisher ships with the VSSDK workload; search across VS versions/editions
          $vsixPublisher = Get-ChildItem `
            "C:\Program Files\Microsoft Visual Studio\*\*\VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe", `
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\*\*\VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $vsixPublisher) { Write-Error "VsixPublisher.exe not found on runner"; exit 1 }

          & $vsixPublisher publish `
            -payload $vsix.FullName `
            -publishManifest src/Wikidown.Vs/publish.json `
            -personalAccessToken $env:VSIX_PAT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Attach .vsix to GitHub Release (vsix-v* tag pushes only) ──────────
      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/vsix-v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/Wikidown.Vs/artifacts/vsix/*.vsix
