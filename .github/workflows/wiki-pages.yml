name: wiki-pages

# Reusable: publish any repo's Wikidown wiki to GitHub Pages with
# `wikidown export-html`. Set the repo's Settings → Pages → Source to
# "GitHub Actions", then call it (`wikidown pages` writes this for you):
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   permissions:
#     contents: read
#     pages: write
#     id-token: write
#   concurrency:
#     group: pages
#     cancel-in-progress: false
#   jobs:
#     pages:
#       uses: markdav-is/Wikidown/.github/workflows/wiki-pages.yml@main
#       with:
#         root: docs

on:
  workflow_call:
    inputs:
      root:
        description: Wiki folder, relative to the repo root
        type: string
        default: docs
      base-url:
        description: Path prefix when the site isn't at the domain root (e.g. /my-repo); empty uses _config.yml's baseurl, else the Pages site's own path
        type: string
        default: ''
      cli-version:
        description: Wikidown.Cli version to install; empty for the latest
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the Wikidown CLI
        env:
          CLI_VERSION: ${{ inputs.cli-version }}
        run: |
          if [ -n "$CLI_VERSION" ]; then
            dotnet tool install -g Wikidown.Cli --version "$CLI_VERSION"
          else
            dotnet tool install -g Wikidown.Cli
          fi

      - id: pages
        uses: actions/configure-pages@v5

      # A project site without a custom domain lives under /<repo>; GitHub
      # reports that path, so links work without setting baseurl by hand.
      - name: Export the wiki
        env:
          WIKI_ROOT: ${{ inputs.root }}
          BASE_URL: ${{ inputs.base-url }}
          PAGES_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          args=(export-html --root "$WIKI_ROOT" --output _site --clean)
          if [ -z "$BASE_URL" ] && ! grep -qE '^baseurl:[[:space:]]*[^[:space:]#]' "$WIKI_ROOT/_config.yml" 2>/dev/null; then
            BASE_URL="$PAGES_PATH"
          fi
          [ -n "$BASE_URL" ] && args+=(--base-url "$BASE_URL")
          wikidown "${args[@]}"
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
