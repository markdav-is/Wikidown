name: cli-native

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
      - 'src/Wikidown.Cli/**'
      - 'src/Wikidown.Core/**'
      - 'src/Wikidown.Pdf/**'
      - '.github/workflows/cli-native.yml'
    tags:
      - 'cli-v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach binaries to GitHub Releases

jobs:
  # NuGet publishes on every version bump, but the binaries only ship with a
  # GitHub Release. Cut the cli-v<version> release from main as soon as the
  # version has no tag yet, so a forgotten tag can't leave agents (which
  # rarely have .NET) stuck on the previous binary. A tag created here with
  # GITHUB_TOKEN doesn't trigger another run, so the release is made in this one.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cli-v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 0
          version=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          if git ls-remote --exit-code --tags origin "refs/tags/cli-v$version" > /dev/null; then
            echo "cli-v$version already released"
          else
            echo "tag=cli-v$version" >> "$GITHUB_OUTPUT"
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: win-arm64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar
          - rid: osx-x64
            os: macos-latest
            archive: tar
          - rid: osx-arm64
            os: macos-latest
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish self-contained single-file binary
        run: >
          dotnet publish src/Wikidown.Cli -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path publish/${{ matrix.rid }}/wikidown.exe -DestinationPath artifacts/wikidown-${{ matrix.rid }}.zip

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        run: |
          mkdir -p artifacts
          chmod +x publish/${{ matrix.rid }}/wikidown
          tar -czf artifacts/wikidown-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} wikidown

      - uses: actions/upload-artifact@v4
        with:
          name: wikidown-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wikidown-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
