name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/Wikidown.Html/**'
      - 'src/Wikidown.Core/**'
      - 'src/Wikidown.Cli/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CUSTOM_DOMAIN: wikidown.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4

      - uses: actions/configure-pages@v5

      # Dogfood: wikidown.org is this repo's own /docs wiki rendered
      # through the starter theme by `wikidown export-html` — no Jekyll.
      - name: Export the wiki
        run: |
          dotnet run --project src/Wikidown.Cli --configuration Release -- export-html --output publish/site --clean
          touch publish/site/.nojekyll
          echo "$CUSTOM_DOMAIN" > publish/site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
