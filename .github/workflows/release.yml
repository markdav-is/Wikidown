name: release

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
      - 'src/Wikidown.Cli/**'
      - 'src/Wikidown.Core/**'
      - 'assets/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # NuGet Trusted Publishing: OIDC token exchanged for a short-lived key

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Wikidown.slnf -c Release

      - name: Pack
        run: |
          dotnet pack src/Wikidown.Core/Wikidown.Core.csproj -c Release -o artifacts
          dotnet pack src/Wikidown.Cli/Wikidown.Cli.csproj -c Release -o artifacts

      # Trusted Publishing instead of a stored API key, which expired and
      # blocked the 0.13.0 publish. Needs a policy on nuget.org (owner
      # markdav-is, repo Wikidown, workflow release.yml) and the nuget.org
      # profile name in the NUGET_USER secret.
      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: wikidown-nupkgs
          path: artifacts/*.nupkg
