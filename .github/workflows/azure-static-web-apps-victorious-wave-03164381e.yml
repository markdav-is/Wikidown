name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish editor (Blazor WASM, net10 — Oryx can't)
        run: dotnet publish src/Wikidown.Web/Wikidown.Web.csproj -c Release -o publish/web
      # Oryx doesn't recognize the isolated-worker project and ships it as an
      # empty Node app; managed functions top out at dotnet-isolated:9.0,
      # declared in staticwebapp.config.json.
      - name: Publish API (Azure Functions, .NET 9 isolated)
        run: dotnet publish src/Wikidown.Api/Wikidown.Api.csproj -c Release -o publish/api
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "publish/web/wwwroot"
          api_location: "publish/api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
